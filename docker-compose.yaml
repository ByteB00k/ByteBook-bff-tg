services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - BOT_TOKEN=${BOT_TOKEN}

  ngrok:
    image: ngrok/ngrok:latest
    platform: linux/amd64
    depends_on:
      - app
    command: ngrok http app:8080
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
