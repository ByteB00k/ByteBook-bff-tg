spring:
  application:
    name:
       - bff-tg

server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: true
    key-store: ${SSL_KEY_STORE}
    key-store-password: ${SSL_KEY_STORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: ${SSL_KEY_ALIAS}

telegram:
  bot:
   token: ${BOT_TOKEN}

logging:
  level:
    org.springframework.web: DEBUG